# SG market override for the Singapore deployment (sg.dd-demo-sg-llm.com).
#
# Usage (always layered on top of the backend compose file):
#   docker compose -f docker-compose-backend.yml -f docker-compose.sg.yml up -d
#
# Same Datadog identity as laptop and the other SG compose files:
# sg-hawker-showdown / sg-production / 1.0.0.
services:
  app:
    container_name: llm-sg-app
    environment:
      - DD_SERVICE=sg-hawker-showdown
      - DD_LLMOBS_ML_APP=sg-hawker-showdown
      - DD_ENV=sg-production
      - DD_VERSION=1.0.0
      - DD_TRACE_AGENT_PORT=8126

    # /menu 302-redirects to /game, and GCP health checks only accept 2xx.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/game"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  datadog:
    container_name: datadog-sg
    environment:
      - DD_ENV=sg-production
      - DD_TAGS=market:sg
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true

networks:
  default:
    name: llm-sg-network
