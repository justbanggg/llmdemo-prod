# VN market override for the Vietnam host (vn.dd-demo-sg-llm.com).
#
# Do not apply this overlay to the Singapore hawker branch. It would stamp
# hawker traces as Vietnam. Use it only on the Hanoi coffee VM/branch:
#   docker compose -f docker-compose-backend.yml -f docker-compose.vn.yml up -d
#
# Singapore hawker reports as sg-hawker-showdown / sg-production.
services:
  app:
    container_name: llm-vn-app
    environment:
      - DD_SERVICE=hanoi-coffee-guardrail-vn
      - DD_ENV=vn-production
      - DD_LLMOBS_ML_APP=hanoi-coffee-guardrail-vn
      - DD_TRACE_AGENT_PORT=8126

    # /menu now 302-redirects to /game, so probe /game directly.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/game"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  datadog:
    container_name: datadog-vn
    environment:
      - DD_ENV=vn-production
      - DD_TAGS=market:vn
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true

networks:
  default:
    name: llm-vn-network
