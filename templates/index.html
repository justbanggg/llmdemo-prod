<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datadog Live Thailand</title>
  <link rel="stylesheet" href="/static/style.css">

  <script>
    (function(h,o,u,n,d) {
       h=h[d]=h[d]||{q:[],onReady:function(c){h.q.push(c)}}
       d=o.createElement(u);d.async=1;d.src=n
       n=o.getElementsByTagName(u)[0];n.parentNode.insertBefore(d,n)
    })(window,document,'script','https://www.datadoghq-browser-agent.com/us1/v5/datadog-rum.js','DD_RUM')

    window.isDatadogSynthetics = function () {
      try {
        if (window._DATADOG_SYNTHETICS) return true;
        if (navigator.userAgent && /DatadogSynthetics/i.test(navigator.userAgent)) return true;
      } catch (e) {}
      return false;
    };

    window.DD_RUM.onReady(function() {
      window.DD_RUM.init({
        applicationId: '7636915f-0c98-4c3c-804a-cc5ef9caed8d',
        clientToken: 'pub12980eb2d64122ba88c8e7a662cba363',
        site: 'datadoghq.com',
        service: '{{ dd_service }}',
        env: '{{ dd_env }}',
        version: '{{ dd_version }}',
        sessionSampleRate: 100,
        sessionReplaySampleRate: 100,
        trackUserInteractions: true,
        trackResources: true,
        trackLongTasks: true,
        defaultPrivacyLevel: 'mask-user-input',
        allowedTracingUrls: [
          {
            match: function (url) {
              if (!url) return false;
              if (url.startsWith(window.location.origin)) return true;
              return /https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?(?:\/|$)/.test(url) ||
                /https:\/\/(?:[a-z0-9-]+\.)?dd-demo-sg-llm\.com(?:\/|$)/.test(url);
            },
            propagatorTypes: ["datadog", "tracecontext"]
          }
        ],
        traceSampleRate: 100
      });
      window.DD_RUM.startSessionReplayRecording({ force: true });

      function setRUMUserContext() {
        const userName = sessionStorage.getItem("user_name") || localStorage.getItem('shopAssistUser') || 'anonymous';
        window.DD_RUM.setUser({
          id: userName,
          name: userName,
          page: 'welcome',
          session_type: 'demo',
          entry_point: 'index',
          traffic: window.isDatadogSynthetics() ? 'synthetics' : 'user'
        });
      }

      setRUMUserContext();
      window.addEventListener('storage', setRUMUserContext);

      try {
        window.DD_RUM.addAction('demo_entered', {
          page: 'welcome',
          entry_point: 'index'
        });
      } catch (rumError) {
        console.warn("RUM tracking error (non-critical):", rumError);
      }
    });
  </script>
</head>
<body>
  <div class="landing">
    <div class="landing-topbar">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-lang="th">TH</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="landing-hero">
      <div class="landing-card">
        <img
          class="landing-logo"
          src="/static/logo_img/datadogvn.png"
          alt="Datadog Live Thailand"
          width="512"
          height="512"
        >
        <h1 class="landing-title" data-i18n="title">Datadog Live Thailand</h1>
        <p class="landing-subtitle" data-i18n="subtitle">
          หนึ่งชามต้มยำ หนึ่ง guardrail และทั้งทริปของคุณบน Datadog
        </p>

        <form class="landing-form" id="landingForm" action="/game" method="get">
          <label for="username" data-i18n="nameLabel">ชื่อและบริษัทของคุณ?</label>
          <input
            id="username"
            class="name-input"
            type="text"
            name="username"
            maxlength="50"
            autocomplete="name"
            data-i18n-placeholder="namePlaceholder"
            placeholder="เช่น bang_datadog"
          >
          <button type="submit" class="primary landing-start" data-dd-action-name="demo_start_journey" data-i18n="cta">
            เริ่มต้นทริป
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const I18N = {
      th: {
        pageTitle: "Datadog Live Thailand",
        title: "Datadog Live Thailand",
        subtitle: "หนึ่งชามต้มยำ หนึ่ง guardrail และทั้งทริปของคุณบน Datadog",
        nameLabel: "ชื่อและบริษัทของคุณ?",
        namePlaceholder: "เช่น bang_datadog",
        nameRequired: "กรอกชื่อก่อนนะ",
        cta: "เริ่มต้นทริป",
        starting: "กำลังเปิด..."
      },
      en: {
        pageTitle: "Datadog Live Thailand",
        title: "Datadog Live Thailand",
        subtitle: "One bowl of tom yum, one guardrail, and your whole session journey in Datadog.",
        nameLabel: "What's your name and company?",
        namePlaceholder: "e.g. bang_datadog",
        nameRequired: "Please enter your name first!",
        cta: "Start your journey",
        starting: "Starting..."
      }
    };

    const usernameInput = document.getElementById("username");
    const startButton = document.querySelector(".landing-start");
    const landingForm = document.getElementById("landingForm");
    let currentLang = localStorage.getItem("ctf_lang") === "en" ? "en" : "th";

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.th[key] || "";
    }

    function applyLanguage() {
      const copy = I18N[currentLang];
      document.documentElement.lang = currentLang;
      document.title = copy.pageTitle;
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.classList.toggle("is-active", btn.getAttribute("data-lang") === currentLang);
      });
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        const key = el.getAttribute("data-i18n");
        if (copy[key] != null) el.textContent = copy[key];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
        const key = el.getAttribute("data-i18n-placeholder");
        if (copy[key] != null) el.setAttribute("placeholder", copy[key]);
      });
    }

    function setLanguage(lang) {
      currentLang = lang === "en" ? "en" : "th";
      localStorage.setItem("ctf_lang", currentLang);
      applyLanguage();
    }

    document.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setLanguage(btn.getAttribute("data-lang"));
      });
    });

    landingForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = usernameInput.value.trim();
      if (!name) {
        usernameInput.style.borderColor = "var(--error)";
        usernameInput.style.boxShadow = "0 0 0 3px rgba(201, 76, 50, 0.15)";
        usernameInput.placeholder = t("nameRequired");
        usernameInput.focus();
        setTimeout(function () {
          usernameInput.style.borderColor = "";
          usernameInput.style.boxShadow = "";
          usernameInput.placeholder = t("namePlaceholder");
        }, 3000);
        return;
      }

      startButton.disabled = true;
      startButton.textContent = t("starting");
      sessionStorage.setItem("user_name", name);
      try {
        if (window.DD_RUM) {
          window.DD_RUM.setUser({
            id: name,
            name: name,
            page: "welcome",
            session_type: "demo",
            entry_point: "index",
            traffic: window.isDatadogSynthetics() ? "synthetics" : "user"
          });
          window.DD_RUM.addAction("demo_start_journey", {
            user_name: name,
            page: "welcome"
          });
        }
      } catch (rumError) {
        console.warn("RUM tracking error (non-critical):", rumError);
      }
      window.location.href = "/game";
    });

    applyLanguage();
    usernameInput.focus();
  </script>
</body>
</html>
